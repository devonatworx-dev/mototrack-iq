<!DOCTYPE html>
<html lang="en">
<head>
<script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments);};</script>
<script defer src="/_vercel/insights/script.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MotoTrackIQ — End of Day Review</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0d; --card: #1a1a1a; --card-hover: #222;
      --accent: #ff6b35; --accent2: #ff8c5a;
      --text: #ffffff; --muted: #888888; --border: #2a2a2a;
    }

    body {
      background: var(--bg); color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh; padding: 16px;
    }

    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 20px; background: var(--card);
      border-bottom: 1px solid var(--border); border-radius: 12px; margin-bottom: 20px;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-logo { height: 40px; width: auto; display: block; }
    .brand-name { font-size: 18px; font-weight: 700; letter-spacing: -0.5px; }
    .brand-name span { color: var(--accent); }

    .header-right { display: flex; align-items: center; gap: 12px; }
    .back-btn {
      background: #141414; border: 1px solid var(--border); color: var(--text);
      border-radius: 8px; padding: 8px 16px; font-size: 13px; font-weight: 600;
      cursor: pointer; text-decoration: none;
    }
    .back-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Controls ── */
    .controls {
      display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
      margin-bottom: 20px;
    }
    .date-picker-wrap { display: flex; align-items: center; gap: 8px; }
    label { font-size: 13px; color: var(--muted); }
    input[type="date"] {
      background: var(--card); border: 1px solid var(--border);
      color: var(--text); border-radius: 8px; padding: 8px 12px; font-size: 13px;
      cursor: pointer;
    }
    .go-btn {
      background: var(--accent); color: #fff; border: none;
      border-radius: 8px; padding: 8px 18px; font-size: 13px; font-weight: 600;
      cursor: pointer;
    }
    .go-btn:hover { background: var(--accent2); }

    .download-all-btn {
      margin-left: auto; background: #141414; border: 1px solid var(--border);
      color: var(--text); border-radius: 8px; padding: 8px 16px;
      font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .download-all-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Summary cards ── */
    .summary-row {
      display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px;
    }
    .summary-card {
      background: var(--card); border-radius: 12px; padding: 16px 20px;
      flex: 1; min-width: 120px; border: 1px solid var(--border);
    }
    .summary-val { font-size: 24px; font-weight: 700; color: var(--accent); }
    .summary-label { font-size: 11px; color: var(--muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }

    /* ── Table ── */
    .table-wrap { overflow-x: auto; }
    table {
      width: 100%; border-collapse: collapse;
      background: var(--card); border-radius: 12px; overflow: hidden;
    }
    th {
      background: #141414; padding: 12px 16px;
      font-size: 11px; font-weight: 700; color: var(--accent);
      text-transform: uppercase; letter-spacing: 0.5px;
      text-align: left; border-bottom: 1px solid var(--border);
    }
    td {
      padding: 12px 16px; font-size: 13px;
      border-bottom: 1px solid #141414;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--card-hover); }

    .tag {
      display: inline-block; background: #2a2a2a; color: var(--muted);
      padding: 2px 8px; border-radius: 20px; font-size: 11px;
    }
    .tag-rider { background: #1a2a1a; color: #4ade80; }
    .tag-device { background: #1a1a2a; color: #60a5fa; }

    .download-btn {
      background: transparent; border: 1px solid var(--accent);
      color: var(--accent); border-radius: 8px;
      padding: 5px 12px; font-size: 12px; font-weight: 600;
      cursor: pointer; transition: all 0.2s; white-space: nowrap;
    }
    .download-btn:hover { background: var(--accent); color: #fff; }

    .empty-state {
      text-align: center; padding: 60px 20px;
      color: var(--muted); font-size: 15px;
    }

    .loader {
      display: flex; align-items: center; justify-content: center;
      padding: 40px; color: var(--muted); font-size: 14px; gap: 8px;
    }
    .spinner {
      width: 16px; height: 16px; border: 2px solid #333;
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-msg {
      background: #2a1010; border: 1px solid #5a2020;
      color: #ff8888; border-radius: 10px; padding: 14px 18px;
      font-size: 13px; margin-bottom: 16px;
    }
    .sign-in-state {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 48px 24px;
      text-align: center;
    }
    .sign-in-state h2 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .sign-in-state p { color: var(--muted); font-size: 14px; margin-bottom: 18px; }
    .sign-in-state a {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
    }
  </style>
</head>
<body>

<header>
  <div class="brand">
    <img class="brand-logo" src="./logo.png" alt="MotoTrackIQ">
  </div>
  <div class="header-right">
    <a class="back-btn" href="/dashboard.html">← Device Dashboard</a>
  </div>
</header>

<div id="errorContainer"></div>

<div class="controls">
  <div class="date-picker-wrap">
    <label for="dateInput">Date</label>
    <input type="date" id="dateInput" />
  </div>
  <button class="go-btn" onclick="loadEOD()">Load</button>
  <button class="download-all-btn" id="downloadAllBtn" onclick="downloadAll()" style="display:none">⬇ Download All PDFs</button>
</div>

<div class="summary-row" id="summaryRow">
  <div class="loader" id="summaryLoader"><div class="spinner"></div>Loading…</div>
</div>

<div class="table-wrap" id="tableWrap">
  <div class="loader" id="tableLoader"><div class="spinner"></div>Loading…</div>
</div>

<script src="config.js"></script>
<script>
const API = window.MTIQ_API_DEVICE;
const today = new Date().toISOString().split('T')[0];
const dateInput = document.getElementById('dateInput');
dateInput.value = today;
dateInput.max = today;

const fmtTime  = (s) => { if (!s && s !== 0) return '--'; if (s < 60) return `${s}s`; const m = Math.floor(s / 60), sec = s % 60; return `${m}:${String(sec).padStart(2, '0')}`; };
const fmtSpeed = (v) => (!v ? '--' : `${Math.round(v)} km/h`);
const fmtTs    = (ts) => ts ? new Date(ts).toLocaleTimeString('en-CA', { hour: '2-digit', minute: '2-digit' }) : '--';

let currentData = null;

// The portal stores the rider JWT in localStorage as mtiq_token (index.html's
// authToken). Device routes require Authorization: Bearer <that JWT>.
function riderToken() {
  try {
    const token = localStorage.getItem('mtiq_token') || '';
    return token && token !== 'demo-token' ? token : '';
  } catch (e) {
    return '';
  }
}

function showSignIn() {
  document.getElementById('errorContainer').replaceChildren();
  document.getElementById('summaryRow').replaceChildren();
  const tblEl = document.getElementById('tableWrap');
  tblEl.replaceChildren();
  document.getElementById('downloadAllBtn').style.display = 'none';
  const box = document.createElement('div');
  box.className = 'sign-in-state';
  const title = document.createElement('h2');
  title.textContent = 'Sign in to view';
  const copy = document.createElement('p');
  copy.textContent = 'End-of-day sessions are tied to your rider account.';
  const link = document.createElement('a');
  link.href = '/?login=1';
  link.textContent = 'Sign in';
  box.append(title, copy, link);
  tblEl.appendChild(box);
}

async function loadEOD() {
  const date = dateInput.value;
  const err  = document.getElementById('errorContainer');
  const sumEl = document.getElementById('summaryRow');
  const tblEl = document.getElementById('tableWrap');
  const token = riderToken();
  if (!token) { showSignIn(); return; }

  err.replaceChildren();
  sumEl.replaceChildren();
  tblEl.replaceChildren();
  const spin = () => {
    const wrap = document.createElement('div');
    wrap.className = 'loader';
    wrap.appendChild(Object.assign(document.createElement('div'), { className: 'spinner' }));
    wrap.appendChild(document.createTextNode('Loading…'));
    return wrap;
  };
  sumEl.appendChild(spin());
  tblEl.appendChild(spin());
  document.getElementById('downloadAllBtn').style.display = 'none';

  try {
    const res  = await fetch(`${API}/eod?date=${encodeURIComponent(date)}`, {
      headers: { Authorization: 'Bearer ' + token }
    });
    if (res.status === 401) { showSignIn(); return; }
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    currentData = await res.json();

    const { totalSessions, devices, riders, sessions } = currentData;

    sumEl.replaceChildren(
      summaryCard(totalSessions || 0, 'Sessions'),
      summaryCard(riders?.length || 0, 'Riders'),
      summaryCard(devices?.length || 0, 'Devices')
    );

    if (!sessions || sessions.length === 0) {
      tblEl.replaceChildren();
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = 'No sessions recorded on this date.';
      tblEl.appendChild(empty);
      return;
    }

    tblEl.replaceChildren(buildEodTable(sessions));
    document.getElementById('downloadAllBtn').style.display = sessions.length > 0 ? 'flex' : 'none';
  } catch (e) {
    err.replaceChildren();
    const box = document.createElement('div');
    box.className = 'error-msg';
    box.textContent = 'Failed to load: ' + (e && e.message ? e.message : 'unknown error');
    err.appendChild(box);
    sumEl.replaceChildren();
    tblEl.replaceChildren();
  }
}

function summaryCard(value, label) {
  const card = document.createElement('div');
  card.className = 'summary-card';
  const val = document.createElement('div');
  val.className = 'summary-val';
  val.textContent = value == null ? '0' : String(value);
  const lab = document.createElement('div');
  lab.className = 'summary-label';
  lab.textContent = label;
  card.append(val, lab);
  return card;
}

function eodCell(text, className) {
  const td = document.createElement('td');
  if (className) td.className = className;
  td.textContent = text == null || text === '' ? '—' : String(text);
  return td;
}

function buildEodTable(sessions) {
  const table = document.createElement('table');
  const thead = document.createElement('thead');
  const headRow = document.createElement('tr');
  ['Rider', 'Device', 'Track', 'Bike', 'Laps', 'Best Lap', 'Top Speed', 'Time', 'Action'].forEach((label) => {
    const th = document.createElement('th');
    th.textContent = label;
    headRow.appendChild(th);
  });
  thead.appendChild(headRow);
  const tbody = document.createElement('tbody');
  sessions.forEach((s) => {
    const tr = document.createElement('tr');
    const rider = document.createElement('td');
    const riderTag = document.createElement('span');
    riderTag.className = 'tag tag-rider';
    riderTag.textContent = s.riderName || '—';
    rider.appendChild(riderTag);
    const device = document.createElement('td');
    const deviceTag = document.createElement('span');
    deviceTag.className = 'tag tag-device';
    deviceTag.textContent = s.deviceName || '—';
    device.appendChild(deviceTag);
    const best = document.createElement('td');
    best.style.fontWeight = '700';
    best.style.color = 'var(--accent)';
    best.textContent = fmtTime(s.bestLap);
    const when = document.createElement('td');
    when.style.color = 'var(--muted)';
    when.textContent = fmtTs(s.createdAt);
    const action = document.createElement('td');
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'download-btn';
    btn.textContent = '⬇ PDF';
    btn.dataset.action = 'download-pdf';
    btn.dataset.sessionId = s.id == null ? '' : String(s.id);
    action.appendChild(btn);
    tr.append(
      rider,
      device,
      eodCell(s.track || '—'),
      eodCell(s.bike || '—'),
      eodCell(s.lapCount ?? 0),
      best,
      eodCell(fmtSpeed(s.analysisData?.metrics?.maxSpeed)),
      when,
      action
    );
    tbody.appendChild(tr);
  });
  table.append(thead, tbody);
  return table;
}

document.getElementById('tableWrap').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-action="download-pdf"]');
  if (!btn) return;
  downloadPDF(btn.dataset.sessionId || '');
});

// Reports are protected by a short-lived signed link. Mint one, then navigate.
async function mintReportUrl(sessionId) {
  const token = riderToken();
  if (!token) {
    const err = new Error('sign-in');
    err.code = 'auth';
    throw err;
  }
  const r = await fetch(`${API}/sessions/${encodeURIComponent(sessionId)}/report-link`, {
    headers: { Authorization: 'Bearer ' + token }
  });
  if (r.status === 401) {
    const err = new Error('sign-in');
    err.code = 'auth';
    throw err;
  }
  if (!r.ok) throw new Error('link ' + r.status);
  const { url } = await r.json();
  return window.MTIQ_API_BASE + url;
}

async function downloadPDF(sessionId) {
  try {
    window.location.href = await mintReportUrl(sessionId);
    setTimeout(function(){ if(window.mtiqOpenReview) window.mtiqOpenReview(); }, 4000);
  } catch (e) {
    if (e && e.code === 'auth') { showSignIn(); return; }
    alert('Could not open report: ' + e.message);
  }
}

async function downloadAll() {
  if (!currentData?.sessions?.length) return;
  for (const s of currentData.sessions) {
    await new Promise(r => setTimeout(r, 400));
    try {
      const href = await mintReportUrl(s.id);
      const a = document.createElement('a');
      a.href = href;
      a.download = '';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    } catch (e) {
      if (e && e.code === 'auth') { showSignIn(); return; }
      console.error('downloadAll: session', s.id, e.message);
    }
  }
}

loadEOD();
</script>

<!-- ── In-app Review / Feedback modal (wired to /api/feedback) ── -->
<style>
#mtiqReviewOverlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:9999;padding:16px}
#mtiqReviewOverlay .mtiq-rv-card{background:#111826;color:#e6edf3;border:1px solid rgba(56,189,248,.3);border-radius:16px;max-width:420px;width:100%;padding:26px 24px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#mtiqReviewOverlay h3{margin:0 0 6px;font-size:1.25rem;font-weight:800}
#mtiqReviewOverlay p.sub{margin:0 0 16px;color:#9fb0c3;font-size:.92rem}
#mtiqReviewOverlay .mtiq-stars{display:flex;gap:8px;justify-content:center;margin:6px 0 16px}
#mtiqReviewOverlay .mtiq-stars span{font-size:2rem;cursor:pointer;filter:grayscale(1);opacity:.5;transition:.12s}
#mtiqReviewOverlay .mtiq-stars span.on{filter:none;opacity:1;transform:scale(1.08)}
#mtiqReviewOverlay textarea{width:100%;box-sizing:border-box;background:#0b111c;color:#e6edf3;border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:10px;font:inherit;min-height:74px;resize:vertical}
#mtiqReviewOverlay label.consent{display:flex;gap:8px;align-items:flex-start;font-size:.82rem;color:#9fb0c3;margin:12px 0 18px;cursor:pointer}
#mtiqReviewOverlay .mtiq-rv-btns{display:flex;gap:10px}
#mtiqReviewOverlay button{flex:1;border:0;border-radius:10px;padding:12px;font:inherit;font-weight:700;cursor:pointer}
#mtiqReviewOverlay .mtiq-rv-primary{background:#38bdf8;color:#04121f}
#mtiqReviewOverlay .mtiq-rv-secondary{background:transparent;color:#9fb0c3;border:1px solid rgba(255,255,255,.14)}
#mtiqReviewOverlay .mtiq-rv-thanks{text-align:center;padding:10px 0}
</style>
<div id="mtiqReviewOverlay">
  <div class="mtiq-rv-card">
    <div id="mtiqReviewForm">
      <h3>🏁 How was your report?</h3>
      <p class="sub">Your feedback shapes MotoTrackIQ. Takes 10 seconds.</p>
      <div class="mtiq-stars" id="mtiqStars">
        <span data-v="1">★</span><span data-v="2">★</span><span data-v="3">★</span><span data-v="4">★</span><span data-v="5">★</span>
      </div>
      <textarea id="mtiqReviewComment" placeholder="What worked? What would make it better? (optional)"></textarea>
      <label class="consent"><input type="checkbox" id="mtiqReviewConsent"> You may feature my comment publicly (first name only).</label>
      <div class="mtiq-rv-btns">
        <button class="mtiq-rv-secondary" onclick="mtiqCloseReview()">Not now</button>
        <button class="mtiq-rv-primary" onclick="mtiqSubmitReview()">Send feedback</button>
      </div>
    </div>
    <div id="mtiqReviewThanks" class="mtiq-rv-thanks" style="display:none">
      <h3>🙏 Thank you!</h3>
      <p class="sub">We appreciate you helping make MotoTrackIQ better.</p>
      <button class="mtiq-rv-primary" style="width:100%" onclick="mtiqCloseReview()">Close</button>
    </div>
  </div>
</div>
<script>
(function(){
  var _rating=0;
  window.mtiqOpenReview=function(){
    try{ if(localStorage.getItem('mtiq_reviewed')==='1') return; }catch(e){}
    var o=document.getElementById('mtiqReviewOverlay'); if(o) o.style.display='flex';
  };
  window.mtiqCloseReview=function(){ var o=document.getElementById('mtiqReviewOverlay'); if(o) o.style.display='none'; };
  window.mtiqSubmitReview=async function(){
    var comment=(document.getElementById('mtiqReviewComment')||{}).value||'';
    var consent=(document.getElementById('mtiqReviewConsent')||{}).checked||false;
    if(!_rating && !comment.trim()){ alert('Add a star rating or a comment first.'); return; }
    var base=window.MTIQ_API_BASE||'';
    var token=null; try{ token=localStorage.getItem('authToken'); }catch(e){}
    try{
      await fetch(base+'/api/feedback',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},token?{'Authorization':'Bearer '+token}:{}),body:JSON.stringify({rating:_rating||null,comment:comment.trim()||null,consentPublic:consent})});
    }catch(e){ /* best-effort; still thank the rider */ }
    try{ localStorage.setItem('mtiq_reviewed','1'); }catch(e){}
    var f=document.getElementById('mtiqReviewForm'), t=document.getElementById('mtiqReviewThanks');
    if(f) f.style.display='none'; if(t) t.style.display='block';
  };
  document.addEventListener('DOMContentLoaded',function(){
    var stars=document.querySelectorAll('#mtiqStars span');
    stars.forEach(function(s){ s.addEventListener('click',function(){
      _rating=parseInt(s.getAttribute('data-v'),10);
      stars.forEach(function(x){ x.classList.toggle('on', parseInt(x.getAttribute('data-v'),10)<=_rating); });
    });});
  });
})();
</script>
<!-- ── end review modal ── -->

</body>
</html>
