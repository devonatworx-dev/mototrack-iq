<!DOCTYPE html>
<html lang="en">
<head>
<script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments);};</script>
<script defer src="/_vercel/insights/script.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MotoTrackIQ — Device Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0d;
      --card: #1a1a1a;
      --card-hover: #222;
      --accent: #ff6b35;
      --accent2: #ff8c5a;
      --text: #ffffff;
      --muted: #888888;
      --border: #2a2a2a;
      --green: #4ade80;
      --yellow: #fbbf24;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      padding: 16px;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 20px;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-logo { height: 40px; width: auto; display: block; }
    .brand-name { font-size: 18px; font-weight: 700; letter-spacing: -0.5px; }
    .brand-name span { color: var(--accent); }

    .header-right { display: flex; align-items: center; gap: 12px; }
    .last-updated { font-size: 12px; color: var(--muted); }
    .refresh-btn {
      background: var(--accent); color: #fff;
      border: none; border-radius: 8px;
      padding: 8px 16px; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: background 0.2s;
    }
    .refresh-btn:hover { background: var(--accent2); }

    /* ── Slot grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    /* ── Slot card ── */
    .slot-card {
      background: var(--card);
      border-radius: 16px;
      padding: 20px;
      border: 1px solid var(--border);
      transition: border-color 0.2s;
    }
    .slot-card:hover { border-color: var(--accent); }

    .slot-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px;
    }
    .slot-label {
      font-size: 13px; font-weight: 700;
      color: var(--accent); text-transform: uppercase; letter-spacing: 1px;
    }
    .slot-badge {
      font-size: 11px; background: #2a2a2a; color: var(--muted);
      padding: 3px 8px; border-radius: 20px;
    }

    .rider-name { font-size: 20px; font-weight: 700; margin-bottom: 2px; }
    .rider-name.empty { color: var(--muted); font-weight: 400; font-size: 16px; }

    .no-session {
      color: var(--muted); font-size: 14px;
      padding: 16px 0; text-align: center;
      border: 1px dashed #333; border-radius: 10px; margin-top: 10px;
    }

    .stats-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .stat {
      background: #141414; border-radius: 10px;
      padding: 10px 12px; flex: 1; min-width: 80px;
      text-align: center;
    }
    .stat-val { font-size: 18px; font-weight: 700; }
    .stat-val.accent { color: var(--accent); }
    .stat-val.green  { color: var(--green); }
    .stat-label { font-size: 10px; color: var(--muted); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }

    .session-list { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
    .session-item {
      background: #141414; border-radius: 10px; padding: 10px 14px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .session-info { display: flex; flex-direction: column; }
    .session-time { font-size: 12px; color: var(--muted); }
    .session-laps { font-size: 11px; color: #555; margin-top: 2px; }
    .session-best { font-size: 13px; font-weight: 700; color: var(--accent); }
    .view-btn {
      background: transparent; border: 1px solid var(--accent);
      color: var(--accent); border-radius: 8px;
      padding: 5px 12px; font-size: 12px; font-weight: 600;
      cursor: pointer; transition: all 0.2s; white-space: nowrap;
    }
    .view-btn:hover { background: var(--accent); color: #fff; }

    /* ── EOD section ── */
    .eod-bar {
      background: var(--card); border-radius: 12px;
      padding: 16px 24px; display: flex; align-items: center;
      justify-content: space-between; border: 1px solid var(--border);
    }
    .eod-info { font-size: 14px; }
    .eod-info strong { color: var(--accent); font-size: 20px; }
    .eod-btn {
      background: #141414; border: 1px solid var(--border);
      color: var(--text); border-radius: 10px;
      padding: 10px 20px; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: all 0.2s;
    }
    .eod-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Loading ── */
    .loader {
      display: flex; align-items: center; justify-content: center;
      padding: 40px; color: var(--muted); font-size: 14px; gap: 8px;
    }
    .spinner {
      width: 16px; height: 16px; border: 2px solid #333;
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Error ── */
    .error-msg {
      background: #2a1010; border: 1px solid #5a2020;
      color: #ff8888; border-radius: 10px; padding: 14px 18px;
      font-size: 13px; margin-bottom: 16px;
    }

    .sign-in-state {
      grid-column: 1 / -1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 48px 24px;
      text-align: center;
    }
    .sign-in-state h2 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .sign-in-state p { color: var(--muted); font-size: 14px; margin-bottom: 18px; }
    .sign-in-state a {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
    }
  </style>
</head>
<body>

<header>
  <div class="brand">
    <img class="brand-logo" src="./logo.png" alt="MotoTrackIQ">
  </div>
  <div class="header-right">
    <span class="last-updated" id="lastUpdated">—</span>
    <button class="refresh-btn" onclick="loadData()">↻ Refresh</button>
  </div>
</header>

<div id="errorContainer"></div>

<div class="grid" id="slotGrid">
  <div class="loader"><div class="spinner"></div>Loading device data…</div>
</div>

<div class="eod-bar">
  <div class="eod-info">
    Today: <strong id="todayCount">—</strong> sessions across
    <strong id="todayDevices">—</strong> device(s)
  </div>
  <button class="eod-btn" onclick="window.open('/eod.html','_self')">📋 End of Day Review →</button>
</div>

<script src="config.js"></script>
<script>
const API = window.MTIQ_API_DEVICE;
const SLOT_LABELS = ['RaceBox — Slot 1', 'RaceBox — Slot 2', 'RaceBox — Slot 3', 'RaceBox — Slot 4'];

const fmtTime = (s) => {
  if (!s && s !== 0) return '--';
  if (s < 60)  return `${s}s`;
  const m = Math.floor(s / 60), sec = s % 60;
  return `${m}:${String(sec).padStart(2, '0')}`;
};
const fmtSpeed = (v) => (!v ? '--' : `${Math.round(v)} km/h`);
const fmtTs   = (ts) => ts ? new Date(ts).toLocaleTimeString('en-CA', { hour: '2-digit', minute: '2-digit' }) : '--';

let allSessions = [];

// The portal stores the rider JWT in localStorage as mtiq_token (index.html's
// authToken). Device routes require Authorization: Bearer <that JWT>.
function riderToken() {
  try {
    const token = localStorage.getItem('mtiq_token') || '';
    return token && token !== 'demo-token' ? token : '';
  } catch (e) {
    return '';
  }
}

function showSignIn() {
  clearTimeout(window._rt);
  document.getElementById('errorContainer').replaceChildren();
  const grid = document.getElementById('slotGrid');
  grid.replaceChildren();
  document.getElementById('todayCount').textContent = '—';
  document.getElementById('todayDevices').textContent = '—';
  document.getElementById('lastUpdated').textContent = '—';
  const box = document.createElement('div');
  box.className = 'sign-in-state';
  const title = document.createElement('h2');
  title.textContent = 'Sign in to view';
  const copy = document.createElement('p');
  copy.textContent = 'Device sessions are tied to your rider account.';
  const link = document.createElement('a');
  link.href = '/?login=1';
  link.textContent = 'Sign in';
  box.append(title, copy, link);
  grid.appendChild(box);
}

async function loadData() {
  const err = document.getElementById('errorContainer');
  const grid = document.getElementById('slotGrid');
  const token = riderToken();
  if (!token) { showSignIn(); return; }

  err.replaceChildren();
  grid.replaceChildren();
  const loading = document.createElement('div');
  loading.className = 'loader';
  loading.appendChild(Object.assign(document.createElement('div'), { className: 'spinner' }));
  loading.appendChild(document.createTextNode('Loading…'));
  grid.appendChild(loading);

  try {
    const res = await fetch(`${API}/sessions/today`, {
      headers: { Authorization: 'Bearer ' + token }
    });
    if (res.status === 401) { showSignIn(); return; }
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    allSessions = json.sessions || [];

    document.getElementById('lastUpdated').textContent =
      new Date().toLocaleTimeString('en-CA', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    document.getElementById('todayCount').textContent  = allSessions.length;
    document.getElementById('todayDevices').textContent = new Set(allSessions.map(s => s.deviceName).filter(Boolean)).size;

    const bySlot = {};
    for (let i = 1; i <= 4; i++) bySlot[i] = [];
    allSessions.forEach(s => { const slot = parseInt(s.slotId) || 1; if (!bySlot[slot]) bySlot[slot] = []; bySlot[slot].push(s); });
    bySlot[1] = bySlot[1] || []; // ensure 4 slots always exist

    grid.replaceChildren();
    for (let slot = 1; slot <= 4; slot++) {
      const sessions = bySlot[slot] || [];
      const last    = sessions[0];
      const card    = buildCard(slot, sessions, last);
      grid.appendChild(card);
    }

    // auto-refresh
    clearTimeout(window._rt);
    window._rt = setTimeout(loadData, 30000);
  } catch (e) {
    grid.replaceChildren();
    const box = document.createElement('div');
    box.className = 'error-msg';
    box.textContent = 'Failed to load: ' + (e && e.message ? e.message : 'unknown error') + '. Is the backend running?';
    grid.appendChild(box);
  }
}

function statBox(value, label, tone) {
  const box = document.createElement('div');
  box.className = 'stat';
  const val = document.createElement('div');
  val.className = 'stat-val' + (tone ? ' ' + tone : '');
  val.textContent = value;
  const lab = document.createElement('div');
  lab.className = 'stat-label';
  lab.textContent = label;
  box.append(val, lab);
  return box;
}

function buildCard(slot, sessions, last) {
  const card = document.createElement('div');
  card.className = 'slot-card';

  const bestLap   = sessions.reduce((best, s) => {
    const t = s.analysisData?.lapStats?.best || s.analysisData?.summary?.bestLap || s.analysisData?.bestLap;
    return (!best || t < best) ? t : best;
  }, null);
  const topSpeed   = sessions.reduce((max, s) => Math.max(max, s.analysisData?.metrics?.maxSpeed || 0), 0);
  const bestStr    = fmtTime(bestLap);

  const header = document.createElement('div');
  header.className = 'slot-header';
  const label = document.createElement('span');
  label.className = 'slot-label';
  label.textContent = SLOT_LABELS[slot - 1] || ('Slot ' + slot);
  const badge = document.createElement('span');
  badge.className = 'slot-badge';
  badge.textContent = sessions.length + ' session' + (sessions.length !== 1 ? 's' : '');
  header.append(label, badge);

  const name = document.createElement('div');
  name.className = 'rider-name' + (last ? '' : ' empty');
  name.textContent = last ? (last.riderName == null ? '' : String(last.riderName)) : 'No rider detected';
  card.append(header, name);

  if (!last) {
    const waiting = document.createElement('div');
    waiting.className = 'no-session';
    waiting.textContent = 'Waiting for data…';
    card.appendChild(waiting);
  }

  const stats = document.createElement('div');
  stats.className = 'stats-row';
  stats.append(
    statBox(bestStr, 'Best Lap', 'accent'),
    statBox(fmtSpeed(topSpeed), 'Top Speed', 'green'),
    statBox(String(sessions.length), 'Sessions', '')
  );
  card.appendChild(stats);

  if (sessions.length > 0) {
    const list = document.createElement('div');
    list.className = 'session-list';
    sessions.slice(0, 5).forEach((s) => {
      const item = document.createElement('div');
      item.className = 'session-item';
      const info = document.createElement('div');
      info.className = 'session-info';
      const time = document.createElement('div');
      time.className = 'session-time';
      time.textContent = fmtTs(s.createdAt);
      const laps = document.createElement('div');
      laps.className = 'session-laps';
      laps.textContent = (s.analysisData?.laps?.length || 0) + ' laps';
      info.append(time, laps);
      const right = document.createElement('div');
      right.style.cssText = 'display:flex;align-items:center;gap:8px;';
      const best = document.createElement('span');
      best.className = 'session-best';
      best.textContent = fmtTime(s.analysisData?.lapStats?.best);
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'view-btn';
      btn.textContent = 'View Report';
      btn.dataset.action = 'open-report';
      btn.dataset.sessionId = s.id == null ? '' : String(s.id);
      right.append(best, btn);
      item.append(info, right);
      list.appendChild(item);
    });
    card.appendChild(list);
  }
  return card;
}

document.getElementById('slotGrid').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-action="open-report"]');
  if (!btn) return;
  openReport(btn.dataset.sessionId || '');
});

// Reports are protected by a short-lived signed link. Mint one, then navigate.
async function openReport(sessionId) {
  const token = riderToken();
  if (!token) { showSignIn(); return; }
  try {
    const r = await fetch(API + '/sessions/' + encodeURIComponent(sessionId) + '/report-link', {
      headers: { Authorization: 'Bearer ' + token }
    });
    if (r.status === 401) { showSignIn(); return; }
    if (!r.ok) throw new Error('link ' + r.status);
    const { url } = await r.json();
    try{ localStorage.setItem('mtiq_viewed_report','1'); }catch(e){}
    window.location.href = window.MTIQ_API_BASE + url;
  } catch (e) {
    alert('Could not open report: ' + e.message);
  }
}

// After a rider has viewed a report, ask for feedback (once) on next load.
window.addEventListener('load', function(){
  try{ if(localStorage.getItem('mtiq_viewed_report')==='1'){ setTimeout(function(){ if(window.mtiqOpenReview) window.mtiqOpenReview(); }, 1500); } }catch(e){}
});

loadData();
</script>

<!-- ── In-app Review / Feedback modal (wired to /api/feedback) ── -->
<style>
#mtiqReviewOverlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:9999;padding:16px}
#mtiqReviewOverlay .mtiq-rv-card{background:#111826;color:#e6edf3;border:1px solid rgba(56,189,248,.3);border-radius:16px;max-width:420px;width:100%;padding:26px 24px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#mtiqReviewOverlay h3{margin:0 0 6px;font-size:1.25rem;font-weight:800}
#mtiqReviewOverlay p.sub{margin:0 0 16px;color:#9fb0c3;font-size:.92rem}
#mtiqReviewOverlay .mtiq-stars{display:flex;gap:8px;justify-content:center;margin:6px 0 16px}
#mtiqReviewOverlay .mtiq-stars span{font-size:2rem;cursor:pointer;filter:grayscale(1);opacity:.5;transition:.12s}
#mtiqReviewOverlay .mtiq-stars span.on{filter:none;opacity:1;transform:scale(1.08)}
#mtiqReviewOverlay textarea{width:100%;box-sizing:border-box;background:#0b111c;color:#e6edf3;border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:10px;font:inherit;min-height:74px;resize:vertical}
#mtiqReviewOverlay label.consent{display:flex;gap:8px;align-items:flex-start;font-size:.82rem;color:#9fb0c3;margin:12px 0 18px;cursor:pointer}
#mtiqReviewOverlay .mtiq-rv-btns{display:flex;gap:10px}
#mtiqReviewOverlay button{flex:1;border:0;border-radius:10px;padding:12px;font:inherit;font-weight:700;cursor:pointer}
#mtiqReviewOverlay .mtiq-rv-primary{background:#38bdf8;color:#04121f}
#mtiqReviewOverlay .mtiq-rv-secondary{background:transparent;color:#9fb0c3;border:1px solid rgba(255,255,255,.14)}
#mtiqReviewOverlay .mtiq-rv-thanks{text-align:center;padding:10px 0}
</style>
<div id="mtiqReviewOverlay">
  <div class="mtiq-rv-card">
    <div id="mtiqReviewForm">
      <h3>🏁 How was your report?</h3>
      <p class="sub">Your feedback shapes MotoTrackIQ. Takes 10 seconds.</p>
      <div class="mtiq-stars" id="mtiqStars">
        <span data-v="1">★</span><span data-v="2">★</span><span data-v="3">★</span><span data-v="4">★</span><span data-v="5">★</span>
      </div>
      <textarea id="mtiqReviewComment" placeholder="What worked? What would make it better? (optional)"></textarea>
      <label class="consent"><input type="checkbox" id="mtiqReviewConsent"> You may feature my comment publicly (first name only).</label>
      <div class="mtiq-rv-btns">
        <button class="mtiq-rv-secondary" onclick="mtiqCloseReview()">Not now</button>
        <button class="mtiq-rv-primary" onclick="mtiqSubmitReview()">Send feedback</button>
      </div>
    </div>
    <div id="mtiqReviewThanks" class="mtiq-rv-thanks" style="display:none">
      <h3>🙏 Thank you!</h3>
      <p class="sub">We appreciate you helping make MotoTrackIQ better.</p>
      <button class="mtiq-rv-primary" style="width:100%" onclick="mtiqCloseReview()">Close</button>
    </div>
  </div>
</div>
<script>
(function(){
  var _rating=0;
  window.mtiqOpenReview=function(){
    try{ if(localStorage.getItem('mtiq_reviewed')==='1') return; }catch(e){}
    var o=document.getElementById('mtiqReviewOverlay'); if(o) o.style.display='flex';
  };
  window.mtiqCloseReview=function(){ var o=document.getElementById('mtiqReviewOverlay'); if(o) o.style.display='none'; };
  window.mtiqSubmitReview=async function(){
    var comment=(document.getElementById('mtiqReviewComment')||{}).value||'';
    var consent=(document.getElementById('mtiqReviewConsent')||{}).checked||false;
    if(!_rating && !comment.trim()){ alert('Add a star rating or a comment first.'); return; }
    var base=window.MTIQ_API_BASE||'';
    var token=null; try{ token=localStorage.getItem('authToken'); }catch(e){}
    try{
      await fetch(base+'/api/feedback',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},token?{'Authorization':'Bearer '+token}:{}),body:JSON.stringify({rating:_rating||null,comment:comment.trim()||null,consentPublic:consent})});
    }catch(e){ /* best-effort; still thank the rider */ }
    try{ localStorage.setItem('mtiq_reviewed','1'); }catch(e){}
    var f=document.getElementById('mtiqReviewForm'), t=document.getElementById('mtiqReviewThanks');
    if(f) f.style.display='none'; if(t) t.style.display='block';
  };
  document.addEventListener('DOMContentLoaded',function(){
    var stars=document.querySelectorAll('#mtiqStars span');
    stars.forEach(function(s){ s.addEventListener('click',function(){
      _rating=parseInt(s.getAttribute('data-v'),10);
      stars.forEach(function(x){ x.classList.toggle('on', parseInt(x.getAttribute('data-v'),10)<=_rating); });
    });});
  });
})();
</script>
<!-- ── end review modal ── -->

</body>
</html>
